<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Expense Tracker</h1>

    <!-- Summary cards -->
    <section class="cards">
      <div class="card">
        <span>Total income</span>
        <strong id="income" class="pos">₹0.00</strong>
      </div>
      <div class="card">
        <span>Total expenses</span>
        <strong id="expense" class="neg">₹0.00</strong>
      </div>
      <div class="card">
        <span>Balance</span>
        <strong id="balance">₹0.00</strong>
      </div>
    </section>

    <!-- Add / edit form -->
    <section class="panel">
      <h2 id="formTitle">Add transaction</h2>
      <form id="form" novalidate>
        <label>Type
          <select id="type">
            <option value="expense">Expense</option>
            <option value="income">Income</option>
          </select>
        </label>

        <label>Description
          <input id="desc" type="text" placeholder="e.g. Groceries" maxlength="40">
        </label>

        <label>Amount (₹)
          <input id="amount" type="number" min="0.01" step="0.01" placeholder="0.00">
        </label>

        <label>Category
          <select id="category"></select>
        </label>

        <label>Date
          <input id="date" type="date">
        </label>

        <p id="error"></p>

        <div class="actions">
          <button type="submit" id="saveBtn">Add transaction</button>
          <button type="button" id="cancelBtn" class="ghost" hidden>Cancel edit</button>
        </div>
      </form>
    </section>

    <!-- History -->
    <section class="panel">
      <div class="head">
        <h2>History</h2>
        <label class="filter">Show
          <select id="filter"></select>
        </label>
      </div>
      <ul id="list"></ul>
      <p id="empty">No transactions yet. Add your first one above.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
